[project]
name = "text-to-sql"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.13.4",
    "rapidfuzz>=3.5.0",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.2",
    "anthropic>=1.7.0",
    "sqlglot>=30.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
