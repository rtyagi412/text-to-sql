services:
  catalog-postgres:
    image: pgvector/pgvector:pg16
    container_name: catalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: schema_catalog
    ports:
      - "5435:5432"
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data

volumes:
  catalog_pg_data:
